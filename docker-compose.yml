services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-stream-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cloudstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudstream
      TZ: Asia/Bangkok

    ports:
      - "5444:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstream -d cloudstream"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cloud-stream-network

  kafka-volume-init:
    image: alpine:3.22
    container_name: cloud-stream-kafka-volume-init
    user: root
    restart: "no"

    command:
      - sh
      - -c
      - chown -R 1000:1000 /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: cloud-stream-kafka
    hostname: kafka
    restart: unless-stopped

    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    networks:
      - cloud-stream-network

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: cloud-stream-kafbat-ui
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: cloud-stream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

    ports:
      - "8080:8080"

    networks:
      - cloud-stream-network

volumes:
  postgres_data:
  kafka_data:

networks:
  cloud-stream-network:
    driver: bridge
